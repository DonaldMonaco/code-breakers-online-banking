{% extends "base.html" %}{% block title %}Verify{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Enter your one-time code</h1>
  <p>We sent a 6-digit code to your phone ending in <strong>{{ phone }}</strong>. It expires in 5 minutes.</p>
  <div class="alert demo"><strong>Demo mode:</strong> no text message is sent. Your code is <code>{{ demo_code }}</code></div>
  <form method="post" class="once">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Code <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus autocomplete="one-time-code"></label>
    <button type="submit" class="primary">Verify and sign in</button>
  </form>
  <p class="small"><a href="{{ url_for('login') }}">Start over</a></p>
</section>
{% endblock %}
