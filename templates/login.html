{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in to online banking</h1>
  <form method="post" class="once">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Continue</button>
  </form>
  <p class="muted small">After your password we text a one-time code to your phone. Five wrong passwords lock sign-in for 15 minutes.</p>
  <p class="muted small">Bank employee? <a href="{{ url_for('staff_login') }}">Staff sign-in</a></p>
</section>
{% endblock %}
